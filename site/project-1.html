<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Why Opening Up Is Hard | Project</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">
    <link href="images/favicon.png" rel="apple-touch-icon">

    <link href="css/normalize.css" rel="stylesheet" type="text/css">
    <link href="css/components.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: var(--swatch--black-400);
        height: 100vh;
        overflow: hidden; /* Lock native scrolling on body */
        scroll-behavior: smooth;
      }
      
      body {
        display: flex; 
        flex-direction: column; 
        justify-content: flex-end; 
        padding-top: 7.5rem; 
        box-sizing: border-box;
        transition: padding-top 0.8s cubic-bezier(0.16, 1, 0.3, 1); /* Smooth easing */
      }
      body.is-expanded {
        padding-top: 0;
      }

      /* Transparent Navbar with Difference Blending */
      .dynamic-navbar {
        position: fixed; 
        width: 100%; 
        top: 0; 
        left: 0; 
        z-index: 100; 
        padding: 1.5rem 2rem; 
        box-sizing: border-box;
        mix-blend-mode: difference; /* Magically flips text color based on background */
        pointer-events: none; /* Let clicks pass through empty space */
      }
      .dynamic-navbar * {
        color: #ffffff !important; /* Force white so difference blending flips it to black on light backgrounds */
        pointer-events: auto; /* Re-enable clicks for links */
      }

      .project-viewer-frame {
        height: 100%; /* Fill remaining vertical space */
        max-height: 100%;
        width: 100%;
        max-width: 1400px;
        aspect-ratio: 16 / 9; /* Strictly 16:9 ratio initially */
        margin: 0 auto; 
        overflow-y: auto; 
        background-color: var(--swatch--black-300);
        border: 2px solid rgba(255, 255, 255, 0.1); 
        border-bottom: none; 
        border-radius: 1rem 1rem 0 0; 
        /* Hide scrollbar */
        -ms-overflow-style: none; 
        scrollbar-width: none;
        transition: max-width 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    border-radius 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    border-color 0.8s ease;
      }
      .project-viewer-frame.is-expanded {
        max-width: 100vw;
        aspect-ratio: auto;
        border-radius: 0;
        border-color: transparent;
      }
      .project-viewer-frame::-webkit-scrollbar {
          display: none;
      }
      
      .nav-highlight-link {
          transition: opacity 0.3s ease;
          opacity: 0.4;
      }
      .nav-highlight-link.is-active {
          opacity: 1;
      }
    </style>
</head>
<body class="body">
    
    <!-- Custom Navbar -->
    <header class="dynamic-navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <!-- Close Button & Project Name (Left) -->
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a href="#" onclick="history.back(); return false;" class="navbar_link w-inline-block" style="text-decoration: none;">
                    <div class="footer_nav_span u-text-style-main" style="font-size: 1.25rem; line-height: 1;">✕</div>
                </a>
                <div class="navbar_cta_wrap u-text-style-small u-text-trim-off" style="opacity: 0.7;">
                    Why Opening Up Is Hard
                </div>
            </div>

            <!-- Scroll Links (Right) -->
            <div class="navbar_cta_wrap u-text-style-small u-text-trim-off" style="display: flex; gap: 1rem; align-items: center;">
                <a href="#overview" class="navbar_link w-inline-block nav-highlight-link is-active" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Overview</div></a>
                <a href="#research" class="navbar_link w-inline-block nav-highlight-link" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Research</div></a>
                <a href="#behaviour" class="navbar_link w-inline-block nav-highlight-link" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Behaviour Analysis</div></a>
                <a href="#concept" class="navbar_link w-inline-block nav-highlight-link" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Concept Exploration</div></a>
                <a href="#relay" class="navbar_link w-inline-block nav-highlight-link" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Relay Product</div></a>
            </div>
        </div>
    </header>

    <!-- 3-Sided Border Viewer Area (Scrolls inside) -->
    <div class="project-viewer-frame">
        <div id="overview" class="project-section" style="width: 100%;">
            <link rel="preload" as="image" href="images/Opening Up Is Hard/Project/Overview.png">
            <img src="images/Opening Up Is Hard/Project/Overview.png" decoding="async" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="research" class="project-section" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Research.png" loading="lazy" decoding="async" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="behaviour" class="project-section" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Behavior Analysis.png" loading="lazy" decoding="async" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="concept" class="project-section" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Concept Exploration.png" loading="lazy" decoding="async" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="relay" class="project-section" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Relay Product.png" loading="lazy" decoding="async" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="video" class="project-section" style="width: 100%;">
            <video src="images/Opening Up Is Hard/Project/Video.mp4" controls preload="metadata" style="width: 100%; height: auto; display: block;"></video>
        </div>
        <div id="thankyou" class="project-section" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Thank You.png" loading="lazy" decoding="async" style="width: 100%; height: auto; display: block;" />
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Scroll Interaction for Expanding Frame
        const viewer = document.querySelector('.project-viewer-frame');
        const body = document.body;

        viewer.addEventListener('scroll', () => {
            if (viewer.scrollTop > 50) {
                body.classList.add('is-expanded');
                viewer.classList.add('is-expanded');
            } else {
                body.classList.remove('is-expanded');
                viewer.classList.remove('is-expanded');
            }
        });

        // Smooth scroll anchors
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if(target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Highlight active section using a middle-screen observer band
        const sections = document.querySelectorAll('.project-section');
        const navLinks = document.querySelectorAll('.nav-highlight-link');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting) {
                    navLinks.forEach(link => {
                        if (link.getAttribute('href') === '#' + entry.target.id) {
                            link.classList.add('is-active');
                        } else {
                            link.classList.remove('is-active');
                        }
                    });
                }
            });
        }, { 
            root: document.querySelector('.project-viewer-frame'),
            rootMargin: '-30% 0px -30% 0px', // Triggers when element crosses the middle 40% of the screen
            threshold: 0 // Fires as soon as ANY pixel enters the middle band (crucial for images taller than the screen)
        });

        sections.forEach(s => observer.observe(s));
    });
    </script>
</body>
</html>
