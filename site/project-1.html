<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Why Opening Up Is Hard | Project</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    
    <link href="css/normalize.css" rel="stylesheet" type="text/css">
    <link href="css/components.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: var(--swatch--black-400);
        height: 100vh;
        overflow: hidden; /* Lock native scrolling */
        scroll-behavior: smooth;
      }
      .project-viewer-frame {
        flex: 1; 
        overflow-y: auto; 
        margin: 0 auto; 
        width: 100%; 
        max-width: 1400px; 
        border: 2px solid rgba(255, 255, 255, 0.1); 
        border-bottom: none; 
        border-radius: 1rem 1rem 0 0; 
        background-color: var(--swatch--black-300);
      }
      /* Custom Scrollbar for the viewer */
      .project-viewer-frame::-webkit-scrollbar {
          width: 8px;
      }
      .project-viewer-frame::-webkit-scrollbar-track {
          background: rgba(0,0,0,0.1);
      }
      .project-viewer-frame::-webkit-scrollbar-thumb {
          background: rgba(255,255,255,0.2);
          border-radius: 4px;
      }
      .project-viewer-frame::-webkit-scrollbar-thumb:hover {
          background: rgba(255,255,255,0.4);
      }
    </style>
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding-top: 6rem; background-color: var(--swatch--black-400);">
    
    <!-- Custom Navbar -->
    <header style="position: fixed; width: 100%; top: 0; left: 0; z-index: 100; padding: 1.5rem 2rem; background-color: var(--swatch--black-400);">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <!-- Close Button & Project Name (Left) -->
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a href="#" onclick="history.back(); return false;" class="w-inline-block" style="text-decoration: none;">
                    <div class="footer_nav_span u-text-style-small" style="color: var(--swatch--beige-100); font-size: 1.25rem; line-height: 1;">✕</div>
                </a>
                <div class="footer_nav_span u-text-style-small" style="color: var(--swatch--beige-100); opacity: 0.7;">
                    Why Opening Up Is Hard
                </div>
            </div>

            <!-- Scroll Links (Right) -->
            <div style="display: flex; gap: 1rem; align-items: center;">
                <a href="#overview" class="w-inline-block" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-small" style="color: var(--swatch--beige-100);">Overview</div></a>
                <a href="#research" class="w-inline-block" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-small" style="color: var(--swatch--beige-100);">Research</div></a>
                <a href="#behaviour" class="w-inline-block" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-small" style="color: var(--swatch--beige-100);">Behaviour Analysis</div></a>
                <a href="#concept" class="w-inline-block" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-small" style="color: var(--swatch--beige-100);">Concept Exploration</div></a>
                <a href="#relay" class="w-inline-block" style="text-decoration: none; padding: 0.25rem;"><div class="footer_nav_span u-text-style-small" style="color: var(--swatch--beige-100);">Relay Product</div></a>
            </div>
        </div>
    </header>

    <!-- 3-Sided Border Viewer Area (Scrolls inside) -->
    <div class="project-viewer-frame">
        <div id="overview" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Overview.png" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="research" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Research.png" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="behaviour" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Behavior Analysis.png" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="concept" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Concept Exploration.png" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="relay" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Relay Product.png" style="width: 100%; height: auto; display: block;" />
        </div>
        <div id="video" style="width: 100%;">
            <video src="images/Opening Up Is Hard/Project/Video.mp4" controls style="width: 100%; height: auto; display: block;"></video>
        </div>
        <div id="thankyou" style="width: 100%;">
            <img src="images/Opening Up Is Hard/Project/Thank You.png" style="width: 100%; height: auto; display: block;" />
        </div>
    </div>

    <!-- Smooth scroll script for anchor links -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const viewer = document.querySelector('.project-viewer-frame');
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if(target && viewer) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    });
    </script>
</body>
</html>
