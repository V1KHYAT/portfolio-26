<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CoLab | Project</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">
    <link href="images/favicon.png" rel="apple-touch-icon">

    <link href="css/normalize.css" rel="stylesheet" type="text/css">
    <link href="css/components.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400&display=swap" rel="stylesheet">
    <!-- Preload first slide to eliminate loading lag -->
    <link rel="preload" as="image" href="images/CoLab/01.webp">
    
    <style>
      body.body, html {
        margin: 0;
        padding: 0;
        background-color: var(--swatch--black-400) !important;
        height: 100vh;
        width: 100vw;
        overflow: hidden !important;
      }
      
      body.body {
        display: flex; 
        flex-direction: column; 
        justify-content: flex-end; 
        box-sizing: border-box;
      }

      /* Massive Background Title */
      .background-project-title {
        position: fixed;
        top: 40vh;
        left: 50%;
        transform: translate(-50%, -70%);
        width: 90vw;
        max-width: 1400px;
        text-align: center;
        color: var(--swatch--beige-100);
        z-index: 1;
        font-family: var(--_typography---font--primary-family);
        font-size: clamp(4rem, 12vw, 15rem);
        line-height: 1.1;
        text-transform: uppercase;
        pointer-events: none;
        will-change: transform, opacity;
        transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .is-expanded .background-project-title {
        opacity: 0;
        transform: translate(-50%, -150%);
      }

      /* Navbar - identical to project-1 */
      .dynamic-navbar {
        position: fixed; 
        width: 100%; 
        top: 0; 
        left: 0; 
        z-index: 100; 
        padding: 1.5rem 2rem; 
        box-sizing: border-box;
        mix-blend-mode: difference;
        pointer-events: none;
      }
      .dynamic-navbar * {
        color: #ffffff !important;
        pointer-events: auto;
      }
      .project-navbar-title {
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .is-expanded .project-navbar-title {
        opacity: 0.7; 
        transform: translateY(0);
      }

      /* Viewer Frame - same black as background so it blends */
      .project-viewer-frame {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translate(-50%, 0);
        z-index: 10;
        
        width: 90vw;
        max-width: 1100px; 
        height: 60vh; 
        
        overflow: hidden;
        background-color: var(--swatch--black-400);
        border-radius: 1.5rem 1.5rem 0 0; 
        
        will-change: width, max-width, height, border-radius;
        transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    max-width 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    height 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    border-radius 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .project-viewer-frame.is-expanded {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      /* Slider container */
      .slider-container {
        display: flex;
        align-items: center;
        height: 100%;
        padding-left: 0;
        gap: 0;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                    padding-left 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    gap 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
      }

      .project-viewer-frame.is-expanded .slider-container {
        padding-left: 15vw;
        gap: 3vw;
      }

      /* Slides - fill viewer in collapsed state */
      .presentation-slide {
        flex: 0 0 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: filter 0.8s ease, opacity 0.8s ease, transform 0.8s ease, flex-basis 0.8s cubic-bezier(0.16, 1, 0.3, 1), height 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }

      /* In expanded state: carousel mode */
      .project-viewer-frame.is-expanded .presentation-slide {
        flex: 0 0 70vw;
        height: 80%;
        opacity: 0.5;
        filter: blur(6px);
        transform: scale(0.92);
      }

      .project-viewer-frame.is-expanded .presentation-slide.is-active {
        opacity: 1;
        filter: blur(0px);
        transform: scale(1);
      }

      .presentation-slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .nav-highlight-link {
          transition: opacity 0.3s ease;
          opacity: 0.4;
          cursor: pointer;
      }
      .nav-highlight-link.is-active {
          opacity: 1;
      }
    </style>
</head>
<body class="body">

    <!-- Massive Background Title -->
    <div class="background-project-title">COLAB</div>
    
    <!-- Custom Navbar - identical structure to project-1 -->
    <header class="dynamic-navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <!-- Close Button & Project Name (Left) -->
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a href="#" onclick="history.back(); return false;" class="navbar_link w-inline-block" style="text-decoration: none;">
                    <div class="footer_nav_span u-text-style-main" style="font-size: 1.25rem; line-height: 1;">✕</div>
                </a>
                <!-- Starts hidden, fades in on expand -->
                <div class="navbar_cta_wrap u-text-style-small u-text-trim-off project-navbar-title">
                    CoLab Presentation
                </div>
            </div>

            <!-- Scroll Links (Right) -->
            <div class="navbar_cta_wrap u-text-style-small u-text-trim-off" style="display: flex; gap: 1rem; align-items: center;">
                <div class="footer_nav_span u-text-style-main nav-highlight-link is-active" id="nav-1" style="cursor: pointer; padding: 0.25rem;">Overview</div>
                <div class="footer_nav_span u-text-style-main nav-highlight-link" id="nav-6" style="cursor: pointer; padding: 0.25rem;">Insights</div>
                <div class="footer_nav_span u-text-style-main nav-highlight-link" id="nav-12" style="cursor: pointer; padding: 0.25rem;">Solution</div>
                <div class="footer_nav_span u-text-style-main nav-highlight-link" id="nav-18" style="cursor: pointer; padding: 0.25rem;">Usability Testing</div>
            </div>
        </div>
    </header>

    <!-- Project Viewer Frame -->
    <div class="project-viewer-frame">
        <div class="slider-container" id="slider-root">
            <!-- First slide pre-built for zero-lag initial render -->
            <div class="presentation-slide is-active">
                <img src="images/CoLab/01.webp" alt="Slide 01" loading="eager" decoding="sync">
            </div>
            <!-- Remaining slides injected by JS -->
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const viewer = document.querySelector('.project-viewer-frame');
        const sliderRoot = document.getElementById('slider-root');
        const body = document.body;
        
        let isExpanded = false;
        let isAnimating = false;
        let isSliding = false;
        let currentSlide = 0;
        const totalSlides = 35;
        
        // Collect the pre-built first slide
        const loadedSlides = [sliderRoot.querySelector('.presentation-slide')];

        // Build remaining slides (2 onwards)
        for (let i = 2; i <= totalSlides; i++) {
            const slide = document.createElement('div');
            slide.className = 'presentation-slide';
            
            const img = document.createElement('img');
            const slideNum = i < 10 ? '0' + i : String(i);
            img.src = `images/CoLab/${slideNum}.webp`;
            img.alt = `Slide ${slideNum}`;
            img.loading = i <= 3 ? 'eager' : 'lazy';
            
            img.onerror = () => { slide.dataset.invalid = "true"; slide.style.display = 'none'; };
            
            slide.appendChild(img);
            sliderRoot.appendChild(slide);
            loadedSlides.push(slide);
        }

        function getValidSlideCount() {
            return loadedSlides.filter(s => s.dataset.invalid !== "true").length;
        }

        // --- Expand / Shrink ---
        viewer.addEventListener('transitionend', (e) => {
            if (e.propertyName === 'width' || e.propertyName === 'max-width') {
                isAnimating = false;
            }
        });

        function expandViewer() {
            if (isAnimating || isExpanded) return;
            isAnimating = true;
            isExpanded = true;
            body.classList.add('is-expanded');
            viewer.classList.add('is-expanded');
            // Safety timeout in case transitionend doesn't fire
            setTimeout(() => { isAnimating = false; }, 900);
        }

        function shrinkViewer() {
            if (isAnimating || !isExpanded) return;
            isAnimating = true;
            isExpanded = false;
            body.classList.remove('is-expanded');
            viewer.classList.remove('is-expanded');
            currentSlide = 0;
            updateSlider();
            setTimeout(() => { isAnimating = false; }, 900);
        }

        // --- Slide navigation ---
        function updateSlider() {
            // In expanded mode: slide = 70vw, gap = 3vw, stride = 73vw
            // In collapsed mode: stride doesn't matter (always slide 0)
            const stride = isExpanded ? 73 : 0;
            sliderRoot.style.transform = `translateX(-${currentSlide * stride}vw)`;
            
            // Update active slide state
            loadedSlides.forEach((slide, index) => {
                if (index === currentSlide) {
                    slide.classList.add('is-active');
                } else {
                    slide.classList.remove('is-active');
                }
            });

            // Update Nav Highlights
            document.querySelectorAll('.nav-highlight-link').forEach(l => l.classList.remove('is-active'));
            let targetNav = 'nav-1';
            if (currentSlide >= 17) targetNav = 'nav-18';
            else if (currentSlide >= 11) targetNav = 'nav-12';
            else if (currentSlide >= 5) targetNav = 'nav-6';
            const navLink = document.getElementById(targetNav);
            if (navLink) navLink.classList.add('is-active');
        }

        function goToSlide(index) {
            if (isSliding) return;
            const validCount = getValidSlideCount();
            if (index < 0) {
                shrinkViewer();
                return;
            }
            if (index >= validCount) return;
            
            isSliding = true;
            currentSlide = index;
            updateSlider();
            setTimeout(() => { isSliding = false; }, 650);
        }

        // --- Global wheel listener ---
        window.addEventListener('wheel', (e) => {
            e.preventDefault();

            if (!isExpanded && e.deltaY > 0) {
                expandViewer();
                return;
            }
            if (!isExpanded && e.deltaY < 0) {
                history.back();
                return;
            }
            if (isExpanded && currentSlide === 0 && e.deltaY < 0) {
                shrinkViewer();
                return;
            }
            if (isExpanded && !isSliding && Math.abs(e.deltaY) > 20) {
                if (e.deltaY > 0) {
                    goToSlide(currentSlide + 1);
                } else {
                    goToSlide(currentSlide - 1);
                }
            }
        }, { passive: false });

        // Touch support
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const delta = touchStartY - e.touches[0].clientY;
            if (!isExpanded && delta > 10) { e.preventDefault(); expandViewer(); return; }
            if (!isExpanded && delta < -10) { e.preventDefault(); history.back(); return; }
            if (isExpanded && currentSlide === 0 && delta < -10) { e.preventDefault(); shrinkViewer(); return; }
            if (isExpanded && !isSliding && Math.abs(delta) > 50) {
                e.preventDefault();
                goToSlide(delta > 0 ? currentSlide + 1 : currentSlide - 1);
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: false });

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (!isExpanded) {
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') expandViewer();
                return;
            }
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToSlide(currentSlide + 1);
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToSlide(currentSlide - 1);
        });

        // Nav clicks
        function navGoTo(index) {
            if (!isExpanded) expandViewer();
            // Wait for expand animation then go to slide
            setTimeout(() => goToSlide(index), isExpanded ? 0 : 850);
        }
        document.getElementById('nav-1').addEventListener('click', () => navGoTo(0));
        document.getElementById('nav-6').addEventListener('click', () => navGoTo(5));
        document.getElementById('nav-12').addEventListener('click', () => navGoTo(11));
        document.getElementById('nav-18').addEventListener('click', () => navGoTo(17));
    });
    </script>

</body>
</html>
