<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CoLab | Project</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">
    <link href="images/favicon.png" rel="apple-touch-icon">

    <link href="css/normalize.css" rel="stylesheet" type="text/css">
    <link href="css/components.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
      body.body, html {
        margin: 0;
        padding: 0;
        background-color: var(--swatch--black-400) !important;
        height: 100vh;
        width: 100vw;
        overflow: hidden !important; 
      }
      
      body.body {
        display: flex; 
        flex-direction: column; 
        justify-content: flex-end; 
        box-sizing: border-box;
      }

      /* Massive Background Title */
      .background-project-title {
        position: fixed;
        top: 40vh; 
        left: 50%;
        transform: translate(-50%, -70%); 
        width: 100%;
        text-align: center;
        color: var(--swatch--beige-100);
        z-index: 1; 
        font-family: var(--_typography---font--primary-family);
        font-size: clamp(4rem, 9vw, 12rem);
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
        text-transform: uppercase;
        pointer-events: none;
        will-change: transform, opacity;
        transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .is-expanded .background-project-title {
        opacity: 0;
        transform: translate(-50%, -150%); 
      }

      /* Navbar Updates */
      .dynamic-navbar {
        position: fixed; 
        width: 100%; 
        top: 0; 
        left: 0; 
        z-index: 100; 
        padding: 1.5rem 2rem; 
        box-sizing: border-box;
        mix-blend-mode: difference;
        pointer-events: none;
      }
      .dynamic-navbar * {
        color: #ffffff !important;
        pointer-events: auto;
      }
      .project-navbar-title {
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      .is-expanded .project-navbar-title {
        opacity: 0.7; 
        transform: translateY(0);
      }

      /* Viewer Frame */
      .project-viewer-frame {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translate(-50%, 0);
        z-index: 10;
        
        width: 90vw;
        max-width: 1100px; 
        height: 60vh; 
        
        overflow: hidden; 
        background-color: var(--swatch--black-300);
        border-radius: 1.5rem 1.5rem 0 0; 
        
        will-change: width, max-width, height, border-radius;
        transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    max-width 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    height 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    border-radius 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .project-viewer-frame.is-expanded {
        width: 100vw;
        max-width: 100vw;
        height: 100vh;
        border-radius: 0;
      }

      /* Horizontal Slides Physics */
      .slider-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .presentation-slide {
        position: absolute;
        top: 0; left: 0; 
        width: 100%; height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        
        /* Default state (Upcoming Slide) */
        opacity: 0;
        transform: scale(1.15); 
        pointer-events: none;
        z-index: 1;
        
        will-change: transform, opacity;
        transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease;
      }
      .presentation-slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      
      .presentation-slide.is-active {
        opacity: 1;
        transform: scale(1);
        z-index: 2;
        pointer-events: auto;
      }
      
      .presentation-slide.is-past {
        opacity: 0;
        transform: scale(0.85); 
        z-index: 1;
      }
      
      .nav-highlight-link {
          transition: opacity 0.3s ease;
          opacity: 0.4;
      }
      .nav-highlight-link.is-active {
          opacity: 1;
      }
    </style>
</head>
<body class="body">

    <!-- Massive Background Title -->
    <div class="background-project-title">CoLab</div>
    
    <!-- Custom Navbar -->
    <header class="dynamic-navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <!-- Close Button & Project Name -->
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a href="#" onclick="history.back(); return false;" class="navbar_link w-inline-block" style="text-decoration: none;">
                    <div class="footer_nav_span u-text-style-main" style="font-size: 1.25rem; line-height: 1;">✕</div>
                </a>
                <div class="navbar_cta_wrap u-text-style-small u-text-trim-off project-navbar-title">
                    CoLab Presentation
                </div>
            </div>

            <!-- Dynamic Waypoints (Based on slide index) -->
            <div class="navbar_cta_wrap u-text-style-small u-text-trim-off" style="display: flex; gap: 1rem; align-items: center;">
                <div id="nav-1" class="navbar_link nav-highlight-link is-active" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Overview</div></div>
                <div id="nav-6" class="navbar_link nav-highlight-link" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Insights</div></div>
                <div id="nav-12" class="navbar_link nav-highlight-link" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Solution</div></div>
                <div id="nav-18" class="navbar_link nav-highlight-link" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Usability Testing</div></div>
            </div>
        </div>
    </header>

    <!-- Project Viewer Frame -->
    <div class="project-viewer-frame">
        <div class="slider-container" id="slider-root">
            <!-- Slides are dynamically injected here -->
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const viewer = document.querySelector('.project-viewer-frame');
        const body = document.body;
        const sliderRoot = document.getElementById('slider-root');
        
        let isExpanded = false;
        let isAnimating = false;
        let isSliding = false;
        
        let currentSlide = 0;
        const totalSlides = 35; // Increased to cover all 27 slides + headroom
        const loadedSlides = [];

        // Build slides
        for (let i = 1; i <= totalSlides; i++) {
            const slide = document.createElement('div');
            slide.className = 'presentation-slide';
            if (i === 1) slide.classList.add('is-active');
            
            const img = document.createElement('img');
            const slideNum = i < 10 ? '0' + i : i;
            img.src = `images/CoLab/${slideNum}.webp`;
            img.alt = `Slide ${slideNum}`;
            
            // If image fails to load, mark the slide as hidden/invalid so we skip it
            img.onerror = () => { slide.dataset.invalid = "true"; };
            
            slide.appendChild(img);
            sliderRoot.appendChild(slide);
            loadedSlides.push(slide);
        }

        viewer.addEventListener('transitionend', (e) => {
            if (e.propertyName === 'max-width' || e.propertyName === 'width') {
                isAnimating = false;
            }
        });

        function expandViewer() {
            if (isAnimating || isExpanded) return;
            isAnimating = true;
            isExpanded = true;
            body.classList.add('is-expanded');
            viewer.classList.add('is-expanded');
        }

        function shrinkViewer() {
            if (isAnimating || !isExpanded) return;
            isAnimating = true;
            isExpanded = false;
            body.classList.remove('is-expanded');
            viewer.classList.remove('is-expanded');
        }
        
        function updateNavbar() {
            // Reset all
            document.querySelectorAll('.nav-highlight-link').forEach(el => el.classList.remove('is-active'));
            
            // Map slide to nav (1-based index)
            const slideNum = currentSlide + 1;
            if (slideNum >= 18) document.getElementById('nav-18').classList.add('is-active');
            else if (slideNum >= 12) document.getElementById('nav-12').classList.add('is-active');
            else if (slideNum >= 6) document.getElementById('nav-6').classList.add('is-active');
            else document.getElementById('nav-1').classList.add('is-active');
        }

        function goToSlide(index) {
            if (index < 0 || index >= loadedSlides.length || isSliding) return;
            
            // Check if invalid (missing image)
            if (loadedSlides[index].dataset.invalid === "true") {
                // We reached the end of the available slides
                return false; 
            }
            
            isSliding = true;
            
            // Update classes
            for (let i = 0; i < loadedSlides.length; i++) {
                const s = loadedSlides[i];
                s.classList.remove('is-active', 'is-past');
                
                if (i < index) {
                    s.classList.add('is-past'); // Pushed back (scale 0.85)
                } else if (i === index) {
                    s.classList.add('is-active'); // Center (scale 1)
                }
                // i > index remains default (scale 1.15)
            }
            
            currentSlide = index;
            updateNavbar();
            
            setTimeout(() => { isSliding = false; }, 800);
            return true;
        }

        window.addEventListener('wheel', (e) => {
            // Initial Expand
            if (!isExpanded && e.deltaY > 0) {
                e.preventDefault();
                expandViewer();
                return;
            } 
            
            if (isExpanded) {
                e.preventDefault(); // Prevent native scroll
                if (!isSliding && !isAnimating) {
                    if (e.deltaY > 40) { // Scroll Down -> Next Slide
                        const success = goToSlide(currentSlide + 1);
                        if (!success) {
                            // If we tried to go next but hit the end (or invalid slide), exit presentation
                            shrinkViewer();
                        }
                    } else if (e.deltaY < -40) { // Scroll Up -> Prev Slide
                        if (currentSlide > 0) {
                            goToSlide(currentSlide - 1);
                        } else {
                            // If we are at the first slide and scroll up, exit presentation
                            shrinkViewer();
                        }
                    }
                }
            }
        }, { passive: false });

        // Touch support for mobile
        let touchStartY = 0;
        let touchStartX = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isExpanded && (touchStartY - e.touches[0].clientY) > 10) {
                e.preventDefault();
                expandViewer();
                return;
            }
            
            if (isExpanded) {
                e.preventDefault();
                if (!isSliding && !isAnimating) {
                    const deltaY = touchStartY - e.touches[0].clientY;
                    const deltaX = touchStartX - e.touches[0].clientX;
                    
                    // Allow both vertical and horizontal swipes to change slides
                    if (deltaY > 30 || deltaX > 30) {
                        const success = goToSlide(currentSlide + 1);
                        if (!success && deltaY > 30) shrinkViewer(); // Only vertical exits
                    } else if (deltaY < -30 || deltaX < -30) {
                        if (currentSlide > 0) goToSlide(currentSlide - 1);
                        else if (deltaY < -30) shrinkViewer(); // Only vertical exits
                    }
                }
            }
        }, { passive: false });
    });
    </script>
</body>
</html>
