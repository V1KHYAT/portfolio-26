<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>CoLab | Project</title>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
    <link href="images/favicon.png" rel="icon" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">
    <link href="images/favicon.png" rel="apple-touch-icon">

    <link href="css/normalize.css" rel="stylesheet" type="text/css">
    <link href="css/components.css" rel="stylesheet" type="text/css">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400&display=swap" rel="stylesheet">
    
    <style>
      .background-project-title {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        text-align: center;
        font-size: 15vw;
        font-weight: 800;
        text-transform: uppercase;
        color: rgba(0,0,0,0.05); /* very faint */
        pointer-events: none;
        z-index: 1;
      }

      .project-viewer-frame {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: var(--swatch--black-300);
        z-index: 100;
        overflow: hidden;
      }

      .slider-container {
        display: flex;
        align-items: center;
        height: 100%;
        width: max-content;
        padding-left: 7.5vw; /* (100-85)/2 = 7.5vw offset so the first slide centers perfectly */
        gap: 4vw; /* Space between slides */
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
      }

      .presentation-slide {
        width: 85vw; /* Slide width */
        height: 80vh; /* Leave top and bottom room for nav */
        min-height: 0;
        min-width: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
      }

      .presentation-slide img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .dynamic-navbar {
          position: fixed;
          top: 0; left: 0; width: 100%;
          padding: 2rem 5%;
          z-index: 1000;
      }

      /* Active state for dynamic waypoints */
      .nav-highlight-link {
          opacity: 0.4;
          transition: opacity 0.3s;
          cursor: pointer;
      }
      .nav-highlight-link.is-active {
          opacity: 1;
      }
    </style>
</head>
<body class="body">

    
    
    <!-- Custom Navbar -->
    <header class="dynamic-navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <!-- Close Button & Project Name -->
            <div style="display: flex; align-items: center; gap: 2rem;">
                <a href="#" onclick="history.back(); return false;" class="navbar_link w-inline-block" style="text-decoration: none;">
                    <div class="footer_nav_span u-text-style-main" style="font-size: 1.25rem; line-height: 1;">✕</div>
                </a>
                <div class="navbar_cta_wrap u-text-style-small u-text-trim-off project-navbar-title">
                    CoLab Presentation
                </div>
            </div>

            <!-- Dynamic Waypoints (Based on slide index) -->
            <div class="navbar_cta_wrap u-text-style-small u-text-trim-off" style="display: flex; gap: 1rem; align-items: center;">
                <div id="nav-1" class="navbar_link nav-highlight-link is-active" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Overview</div></div>
                <div id="nav-6" class="navbar_link nav-highlight-link" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Insights</div></div>
                <div id="nav-12" class="navbar_link nav-highlight-link" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Solution</div></div>
                <div id="nav-18" class="navbar_link nav-highlight-link" style="padding: 0.25rem;"><div class="footer_nav_span u-text-style-main">Usability Testing</div></div>
            </div>
        </div>
    </header>

    <!-- Project Viewer Frame -->
    <div class="project-viewer-frame">
        <div class="background-project-title">COLAB</div>
          <div class="slider-container" id="slider-root">
            <!-- Slides are dynamically injected here -->
        </div>
    </div>

    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const sliderRoot = document.getElementById('slider-root');
        
        let isSliding = false;
        let currentSlide = 0;
        const totalSlides = 35; // Support up to 35 slides
        const loadedSlides = [];

        // Build slides
        for (let i = 1; i <= totalSlides; i++) {
            const slide = document.createElement('div');
            slide.className = 'presentation-slide';
            
            const img = document.createElement('img');
            const slideNum = i < 10 ? '0' + i : i;
            img.src = `images/CoLab/${slideNum}.webp`;
            img.alt = `Slide ${slideNum}`;
            
            // If image fails to load, mark the slide as hidden/invalid so we skip it
            img.onerror = () => { slide.dataset.invalid = "true"; slide.style.display = 'none'; };
            
            slide.appendChild(img);
            sliderRoot.appendChild(slide);
            loadedSlides.push(slide);
        }

        function getValidSlideCount() {
            return loadedSlides.filter(s => s.dataset.invalid !== "true").length;
        }

        function updateSlider() {
            // Slide width = 85vw. Gap = 4vw. Total stride = 89vw.
            // Since padding-left is 7.5vw on the container, translating by -89vw exactly shifts the next slide into the 7.5vw slot (perfectly centered).
            sliderRoot.style.transform = `translateX(-${currentSlide * 89}vw)`;
            
            // Update Nav Highlights
            document.querySelectorAll('.nav-highlight-link').forEach(l => l.classList.remove('is-active'));
            let targetNav = 'nav-1';
            if (currentSlide >= 17) targetNav = 'nav-18';
            else if (currentSlide >= 11) targetNav = 'nav-12';
            else if (currentSlide >= 5) targetNav = 'nav-6';
            const navLink = document.getElementById(targetNav);
            if(navLink) navLink.classList.add('is-active');
        }

        function goToSlide(index) {
            if (isSliding) return;
            const validCount = getValidSlideCount();
            if (index < 0) {
                // Exit project when scrolling up past the first slide
                history.back();
                return;
            }
            if (index >= validCount) return; // End of slides
            
            isSliding = true;
            currentSlide = index;
            updateSlider();
            setTimeout(() => { isSliding = false; }, 600);
        }

        // Mouse Wheel interaction
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (isSliding) return;
            
            // Threshold for triggering slide
            if (Math.abs(e.deltaY) > 20) {
                if (e.deltaY > 0) {
                    goToSlide(currentSlide + 1);
                } else {
                    goToSlide(currentSlide - 1);
                }
            }
        }, { passive: false });

        // Touch Interaction
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isSliding) return;
            e.preventDefault();
            const delta = touchStartY - e.touches[0].clientY;
            if (Math.abs(delta) > 50) { // Threshold
                if (delta > 0) {
                    goToSlide(currentSlide + 1);
                } else {
                    goToSlide(currentSlide - 1);
                }
                touchStartY = e.touches[0].clientY; // Reset touch anchor
            }
        }, { passive: false });

        // Nav clicks
        document.getElementById('nav-1').addEventListener('click', () => goToSlide(0));
        document.getElementById('nav-6').addEventListener('click', () => goToSlide(5));
        document.getElementById('nav-12').addEventListener('click', () => goToSlide(11));
        document.getElementById('nav-18').addEventListener('click', () => goToSlide(17));
    });
    </script>

</body>
</html>
